# Production stack for inci: the app behind Caddy (automatic HTTPS).
#
# Lives on the server next to a `.env` (see deploy/.env.example) and a
# Caddyfile; deploy/deploy.sh (run by the Jenkinsfile) keeps INCI_TAG in that
# .env pointing at the release currently running.

name: inci

services:
  app:
    image: ${INCI_IMAGE:?set INCI_IMAGE in .env}:${INCI_TAG:?set INCI_TAG in .env}
    restart: unless-stopped
    env_file: .env
    environment:
      # Refuse to start without a real secret: lib/secret.ts would otherwise
      # fall back to a public development value.
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
    volumes:
      - inci-data:/inci-db
    # Hardening: immutable root filesystem, no Linux capabilities, no
    # privilege escalation, bounded resources. The only writable paths are
    # the data volume and the Next.js cache (tmpfs).
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /app/.next/cache:uid=1000,gid=1000,mode=0700,size=256m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    init: true
    pids_limit: 256
    mem_limit: 1g
    # Not published on the host: only reachable through Caddy, which also
    # rewrites X-Forwarded-For so the rate limiter sees the real client IP.
    networks: [backend]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    networks: [backend, edge]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

networks:
  # The app needs no outbound access at runtime (fonts are bundled at build
  # time), so its network has no route to the internet.
  backend:
    internal: true
  edge: {}

volumes:
  inci-data:
  caddy-data:
  caddy-config:
